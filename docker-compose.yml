services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fit-backend
    container_name: fit_backend
    restart: unless-stopped
    ports:
      - "${DOCKER_APP_PORT:-8001}:8000"
    volumes:
      - ./:/var/www/html
      - laravel_vendor:/var/www/html/vendor
      - laravel_bootstrap_cache:/var/www/html/bootstrap/cache
      - laravel_storage_framework:/var/www/html/storage/framework
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:${DOCKER_APP_PORT:-8001}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      LARAVEL_OPTIMIZE: ${LARAVEL_OPTIMIZE:-1}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-fit}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-root}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-1234}
  db:
    image: mysql:8.0
    container_name: fit_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-fit}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASSWORD:-1234}
    ports:
      - "${DOCKER_DB_PORT:-3308}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DOCKER_DB_PASSWORD:-1234}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fit_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DOCKER_DB_USERNAME:-root}
      PMA_PASSWORD: ${DOCKER_DB_PASSWORD:-1234}
    ports:
      - "${DOCKER_PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - db

volumes:
  dbdata:
  laravel_vendor:
  laravel_bootstrap_cache:
  laravel_storage_framework:
